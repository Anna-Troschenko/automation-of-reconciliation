global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: mail-confirm-web
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8765"]
        labels:
          instance: mail-confirm
          component: web

  - job_name: mail-confirm-daemon
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9101"]
        labels:
          instance: mail-confirm
          component: daemon
